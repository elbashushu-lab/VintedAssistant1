name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Trova il progetto
        id: p
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif ls ./*.zip >/dev/null 2>&1; then
            mkdir -p _proj
            unzip -q -o "$(ls ./*.zip | head -n1)" -d _proj
            S=$(find _proj -name settings.gradle.kts | head -n1)
            [ -n "$S" ] || { echo "settings.gradle.kts non trovato nello zip"; exit 1; }
            echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"
          else
            echo "Nessun progetto trovato: carica il file .zip nella radice del repository"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accetta licenze Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Chiave di firma (solo se manca)
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          [ -f app/debug.keystore ] || keytool -genkeypair -keystore app/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Vinted Assistant,O=Personal,C=IT"

      - name: Compila APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepara APK
        run: cp "${{ steps.p.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" VintedAssistant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VintedAssistant-apk
          path: VintedAssistant.apk

      - name: Pubblica nelle Release (link diretto per il telefono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vinted Assistant - build ${{ github.run_number }}
          files: VintedAssistant.apk
          make_latest: true
